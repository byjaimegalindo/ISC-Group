:root{
  --purple:#29022B;
  --blue:#4379BD;
  --gray:#999999;
  --panel-gray:#D9D9D9;
  --text-gray:#555555;
  --line:#C7C7C7;
  --white:#FFFFFF;
  --heavy:"Flexoheavy","Arial Black",Arial,sans-serif;
  --regular:"Flexoregular",Arial,sans-serif;
  --bold:"Flexobold",Arial,sans-serif;
}
*{box-sizing:border-box}
/* Keep page/iframe viewport still: only the white panel scrolls. */
html,body{
  margin:0;padding:0;width:100%;height:100%;min-height:0;
  background:transparent!important;overflow:hidden;
  overscroll-behavior:contain;
}
/* Discrete 3px scroll thumb. Track ends 32px before the lower corner curve.
   Only the inner white content scrolls; all profile elements remain unchanged. */
#profile-content{
  overflow-y:auto;overflow-x:hidden;
  overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;
}
#profile-content::-webkit-scrollbar{width:3px}
#profile-content::-webkit-scrollbar-track{
  background:transparent;
  margin-bottom:32px;
}
#profile-content::-webkit-scrollbar-thumb{
  background:rgba(63,41,68,.17);
  border-radius:999px;
}
#profile-content:hover::-webkit-scrollbar-thumb,
#profile-content:focus-within::-webkit-scrollbar-thumb{
  background:rgba(63,41,68,.27);
}
#profile-content::-webkit-scrollbar-thumb:hover{
  background:rgba(63,41,68,.38);
}
/* Firefox: supports reduced thumb contrast, but not WebKit's track margin. */
@supports (-moz-appearance:none){
  #profile-content{scrollbar-width:thin;scrollbar-color:rgba(63,41,68,.17) transparent}
  #profile-content:hover{scrollbar-color:rgba(63,41,68,.27) transparent}
}
body{font:14px var(--regular);color:var(--purple)}
button,input,textarea{font:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ONLY the popup draws a surface. There is no backdrop or overlay. */
#profile-shell{
  width:100%;max-width:794px;min-width:0;
  margin:0 auto;padding:0;
  background:var(--blue);
  border:12px solid var(--blue);
  border-top:0;
  border-radius:44px;
  overflow:hidden;
  isolation:isolate;
  display:flex;flex-direction:column;
  height:min(840px, 100dvh);min-height:0;
}
.profile-header{
  position:relative;min-height:61px;
  padding:11px 64px 10px 14px;
  display:flex;align-items:center;
  background:var(--blue);color:#fff;
  font:20px/1.23 var(--regular);
  flex:0 0 auto;
}
.profile-header strong{font-family:var(--heavy);font-weight:normal}
#close-popup{
  position:absolute;right:24px;top:50%;transform:translateY(-50%);
  display:grid;place-items:center;width:40px;height:40px;
  padding:0;border:0;border-radius:50%;
  color:#fff;background:var(--purple)
}
#close-popup svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round}
#close-popup:hover{filter:brightness(1.18)}
#profile-content{padding:16px 59px 31px 55px;background:#fff;flex:1 1 auto;min-height:0;}

/* IDENTIFICATION: uses approved profile top, photo and field component families. */
.profile-top{
  width:100%;max-width:none;margin:0 auto 16px;
  display:grid;grid-template-columns:185px minmax(0,1fr);
  gap:18px;align-items:start
}
.photo-upload{
  width:195px;height:195px;margin-left:-16px;border-radius:50%;overflow:hidden;
  background:var(--blue);display:grid;place-items:center;
  color:white
}
.photo-upload img{width:100%;height:100%;object-fit:cover}
.photo-upload svg{width:85px;height:111px;fill:#fff}
.profile-fields{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px 19px;padding-top:3px
}
.profile-field{min-width:0}
.profile-field.full{grid-column:1/-1}
.profile-field label{
  display:block;color:var(--purple);margin:0 0 2px;
  font:14px/1.1 var(--heavy)
}
.profile-field .display-value{
  display:flex;align-items:center;min-height:26px;
  width:100%;padding:4px 13px;border-radius:18px;
  background:var(--panel-gray);color:var(--purple);
  font:14px/1.15 var(--bold);overflow-wrap:anywhere
}
.email-field-row{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:9px;align-items:center}
.email-field-row .display-value{gap:6px;min-width:0;padding-left:10px}
.email-text{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Original primary button family from the approved main HTML. */
.btn{
  min-width:75px;min-height:28px;border:0;border-radius:4px;
  padding:7px 15px;background:var(--purple);color:white;
  font:11px var(--heavy);white-space:nowrap
}
.btn.blue{background:var(--blue)}
.btn:hover{filter:brightness(1.1)}
.contact-btn{min-height:27px;padding:6px 12px;font-size:12px}
.contact-btn:disabled{opacity:.48;cursor:not-allowed}
.copy-btn{
  width:18px;height:20px;padding:0;flex:0 0 18px;
  border:0;background:transparent;color:var(--purple);
  display:grid;place-items:center
}
.copy-btn svg{display:block;width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6}
.copy-btn:disabled{opacity:.5;cursor:not-allowed}

/* Badges reused from Member Match, same purple / blue and Flexo Bold. */
.member-tags{display:flex;align-items:center;justify-content:flex-start;flex-wrap:wrap;gap:7px;margin:0}
.member-tag{
  padding:6px 14px;border-radius:20px;background:var(--purple);
  color:white;font:14px/1.05 var(--bold)
}
.member-tag.mentee{background:var(--blue)}
.role-strip{
  display:grid;grid-template-columns:185px minmax(0,1fr);
  gap:18px;align-items:center;margin:1px 0 24px
}
.type-options{
  display:flex;align-items:center;justify-content:flex-end;
  gap:7px 10px;flex-wrap:wrap;color:#757575;
  font:14px/1.2 var(--heavy)
}
.type-option{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}

/* EXACT checkbox base and tick geometry copied from main HTML, Page 2. */
input[type="checkbox"]{
  appearance:none;-webkit-appearance:none;flex-shrink:0;
  width:15px;height:15px;padding:0;margin:0;
  border:1px solid currentColor;border-radius:0;
  background:#fff;color:#555;
  display:inline-grid;place-items:center;cursor:pointer;vertical-align:middle
}
input[type="checkbox"]::after{
  content:"";display:block;width:8px;height:5px;
  border-left:1.5px solid currentColor;
  border-bottom:1.5px solid currentColor;
  transform:translateY(-1px) rotate(-45deg);opacity:0
}
input[type="checkbox"]:checked::after{opacity:1}
input[type="checkbox"]:disabled{opacity:1;cursor:default}
/* Exact checkbox tick and alignment from the locked #page1 rules. */
#profile-shell input[type="checkbox"]{
  width:16px;height:16px;border-width:1.5px;
  display:inline-flex;align-items:center;justify-content:center;position:relative;
}
#profile-shell input[type="checkbox"]::after{
  width:7px;height:4px;border-left-width:2px;border-bottom-width:2px;
  position:absolute;left:50%;top:calc(50% - 1px);
  transform:translate(-50%,-58%) rotate(-45deg);
}
#profile-shell .type-option input[type="checkbox"]{
  background:var(--panel-gray);border-color:var(--panel-gray);
  color:#777;width:19px;height:19px
}

/* ROLE MATRICES: direct reuse of Page 2 role-block / role-matrix / column DOM. */
.role-block{max-width:none;margin:20px auto 0}
.role-block.mentee{margin-top:43px}
.role-matrix{
  display:grid;
  grid-template-columns:110px minmax(0,1.05fr) minmax(0,1fr) minmax(0,1.05fr);
  gap:14px;align-items:start
}
.role-name{color:var(--purple);font:16px var(--heavy);padding-top:3px;white-space:nowrap}
.mentee .role-name{color:var(--blue)}
.matrix-heading{
  position:relative;z-index:2;
  background:var(--purple);color:white;
  padding:4.5px 11px;border-radius:7px;
  font:14px var(--heavy);
  margin:0 0 -8px 0
}
.mentee .matrix-heading{background:var(--blue)}
/* Popup detail cards: rounded title pill with the grey box tucked softly behind it, matching the design. */
.role-matrix > div{background:transparent;border-radius:0;overflow:visible;min-width:0}
.matrix-options{
  background:var(--panel-gray);margin-top:0;padding:14px 9px 20px;
  min-height:0;border-radius:6px
}
.matrix-options label{
  display:flex;align-items:center;gap:7px;margin:5px 0;
  color:var(--purple);font:15px/1.23 var(--bold);
  white-space:nowrap;cursor:default
}
.matrix-options input{width:16px;height:16px;flex:0 0 16px;color:var(--purple)}
.mentee .matrix-options label,.mentee .matrix-options input{color:var(--blue)}
/* Detail-state variation in the supplied screenshot: only the existing Page 2 tick is visible. */
#profile-shell .matrix-options input[type="checkbox"]{
  background:transparent;border-color:transparent;
  width:16px;height:16px;flex:0 0 16px
}
.role-description-label{margin:11px 0 11px;color:var(--purple);font:15px/1.35 var(--heavy)}
.mentee .role-description-label{color:var(--blue);margin-top:7px;margin-bottom:6px}
.role-bio{
  width:100%;min-height:124px;
  border:0;border-radius:16px;padding:16px 21px;
  color:#151515;background:var(--panel-gray);
  font:15px/1.5 var(--bold);
  overflow-wrap:anywhere;white-space:pre-wrap
}

.popup-actions{
  display:flex;align-items:center;flex-wrap:wrap;
  gap:11px 19px;margin:23px 0 0 -6px
}
.popup-actions .contact-btn{min-width:164px}
.popup-actions>.btn.blue{min-width:92px}
.footer-email{display:inline-flex;align-items:center;gap:5px;min-width:0;font:13px/1.3 var(--bold)}
.footer-email>span{overflow-wrap:anywhere}
#message{padding:32px 20px;color:var(--purple);font:13px var(--bold);text-align:center;flex:1 1 auto;min-height:0;overflow-y:auto;background:#fff}

@media(max-width:760px){
  #profile-shell{border-width:10px;border-top-width:0;border-radius:34px}
  #profile-content{padding:15px 22px 25px}
  .profile-top,.role-strip{grid-template-columns:150px minmax(0,1fr);gap:14px}

/* ISC Group — indicador calcado del HTML principal v3.5.
   El scroll nativo conserva el contenido al 100% de ancho; solo se oculta su barra.
   Barra superpuesta: mismos 3px, tono, separacion, altura y respuesta a hover/drag. */
#profile-shell {position:relative;}
#profile-shell #profile-content {
  scrollbar-width:none !important;
  -ms-overflow-style:none;
}
#profile-shell #profile-content::-webkit-scrollbar {
  display:none !important;
  width:0 !important;
  height:0 !important;
}
#profile-shell .isc-scroll-rail {
  position:absolute;
  z-index:3;
  right:2px;
  top:69px;
  bottom:26px;
  width:18px;
  pointer-events:none;
}
@media(max-width:520px){
  #profile-shell .isc-scroll-rail{right:-1px;bottom:31px;}
}
#profile-shell .isc-scroll-grip {
  position:absolute;
  top:0;
  left:0;
  width:18px;
  height:35px;
  pointer-events:auto;
  cursor:grab;
  touch-action:none;
  user-select:none;
}
#profile-shell .isc-scroll-grip::before {
  content:"";
  position:absolute;
  inset:0 auto 0 7.5px;
  width:3px;
  background:rgba(63,41,68,.17);
  border-radius:999px;
  transition:background .16s ease;
}
#profile-shell .isc-scroll-grip:hover::before,
#profile-shell:hover .isc-scroll-grip::before {
  background:rgba(63,41,68,.27);
}
#profile-shell .isc-scroll-grip:active{cursor:grabbing;}
#profile-shell .isc-scroll-grip:active::before {
  background:rgba(63,41,68,.38);
}
#profile-shell .isc-scroll-rail[hidden]{display:none!important;}
</style>
</head>
<body>
<main id="profile-shell" role="dialog" aria-label="Mentoring member profile" aria-modal="false">
  <header class="profile-header">
    <div>*This is <strong>their information</strong>, matching the filters you selected in your profile.</div>
    <button id="close-popup" type="button" aria-label="Close profile">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5L19 19M19 5L5 19"/></svg>
    </button>
  </header>
  <div id="message" role="status">Loading profile...</div>
  <div id="profile-content" hidden></div>
</main>
<script>
(() => {
  'use strict';
  // Wix NP5 integration contract from the previous popup; intentionally unchanged.
  const HTML_SOURCE = 'ISC_PROFILE_HTML';
  const WIX_SOURCE = 'ISC_PROFILE_WIX';
  const categories = {
    'CAREER LEVEL':['Early Career','Middle Manage.','Senior Leadership','C-suite','Board Exec.'],
    'FUNCTION':['Marketing','Sales','Distribution','Broking','Underwriting','Risk'],
    'AREA':['Lloyd’s','London Market','General Insurance','Regulated','Unregulated']
  };
  const root = document.getElementById('profile-content');
  const message = document.getElementById('message');
  const shell = document.getElementById('profile-shell');
  let currentProfile = null;
  let initialized = false;
  let readyTimer = null;

  function emit(type,payload=null){
    if(window.parent!==window)window.parent.postMessage({source:HTML_SOURCE,type,payload},'*');
  }
  function esc(value){
    return String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  const values = value => Array.isArray(value)
    ? [...new Set(value.map(v=>String(v||'').trim()).filter(Boolean))] : [];
  function roleData(raw){
    const x=raw||{};
    return {
      careerLevel:values(x.careerLevel ?? x['CAREER LEVEL'] ?? x.career ?? x.levels),
      function:values(x.function ?? x['FUNCTION'] ?? x.functions),
      area:values(x.area ?? x['AREA'] ?? x.areas),
      bio:String(x.bio ?? x.description ?? x.summary ?? '').trim()
    };
  }
  function normalize(raw){
    const x=raw||{};
    return {
      id:String(x.id||''),firstName:String(x.firstName||''),lastName:String(x.lastName||''),
      company:String(x.company||''),jobTitle:String(x.jobTitle||''),email:String(x.email||''),
      photo:String(x.photo||''),roles:values(x.roles),types:values(x.types),
      mentor:roleData(x.mentor),mentee:roleData(x.mentee)
    };
  }
  function copyIcon(){
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>';
  }
  function avatar(photo){
    let safe='';
    try {let u=new URL(photo);if(u.protocol==='https:')safe=u.href;}catch(e){}
    return '<div class="photo-upload">'+(safe
      ? `<img src="${esc(safe)}" alt="Member profile photo">`
      : '<svg viewBox="0 0 28.33 36.77" aria-hidden="true" focusable="false"><circle cx="14.16" cy="8.33" r="8.33"/><path d="M14.16,16.74c-7.82,0-14.16,6.34-14.16,14.16s28.33,7.82,28.33,0-6.34-14.16-14.16-14.16Z"/></svg>')+'</div>';
  }
  function field(label,value,full=false){
    return `<div class="profile-field ${full?'full':''}"><label>${esc(label)}</label>`+
      `<div class="display-value">${esc(value)}</div></div>`;
  }
  function contactButton(email){
    return `<button type="button" class="btn contact-btn" data-contact ${email?'':'disabled'}>CONTACT VIA EMAIL</button>`;
  }
  function emailField(email){
    return `<div class="profile-field full"><label>Email</label><div class="email-field-row">`+
      contactButton(email)+`<div class="display-value">`+
      `<button type="button" class="copy-btn" data-copy aria-label="Copy email" ${email?'':'disabled'}>${copyIcon()}</button>`+
      `<span class="email-text">${esc(email)}</span></div></div></div>`;
  }
  function tags(roles){
    return `<div class="member-tags">${['Mentor','Mentee'].filter(r=>roles.includes(r))
      .map(r=>`<span class="member-tag ${r==='Mentee'?'mentee':''}">${r}</span>`).join('')}</div>`;
  }
  function typeMarkup(types){
    return `<div class="type-options"><span>TYPE:</span>${['Traditional','Reverse','Peer-to-Peer'].map(t=>
      `<label class="type-option">${esc(t)}<input type="checkbox" disabled aria-label="${esc(t)}" ${types.includes(t)?'checked':''}></label>`
    ).join('')}</div>`;
  }
  // Exact hierarchy of the approved Page 2 matrix: role-matrix > column > heading + options > label > input + span.
  function matrix(role,data){
    const isMentor=role==='mentor';
    const columns=Object.entries(categories).map(([category,options])=>{
      const chosen=new Set(data[category==='CAREER LEVEL'?'careerLevel':category==='FUNCTION'?'function':'area']);
      return `<div><div class="matrix-heading">${esc(category)}</div><div class="matrix-options">${options.map(option=>
        `<label><input type="checkbox" disabled data-role="${role}" data-category="${esc(category)}" value="${esc(option)}" ${chosen.has(option)?'checked':''}><span>${esc(option)}</span></label>`
      ).join('')}</div></div>`;
    }).join('');
    const caption=isMentor
      ?'Share the experience and expertise the knowledge and experience you can share with others:'
      :'Share your development interests areas where you would value another person’s experience or perspective:';
    return `<section class="role-block ${role}"><div class="role-matrix">`+
      `<strong class="role-name">AS A ${role.toUpperCase()}</strong>${columns}</div>`+
      `<p class="role-description-label">${esc(caption)}</p>`+
      `<div class="role-bio">${esc(data.bio)}</div></section>`;
  }
  function render(profile){
    const email=profile.email.trim();
    root.innerHTML=`<div class="profile-top">${avatar(profile.photo)}`+
      `<div class="profile-fields">${field('First Name',profile.firstName)}`+
      `${field('Last Name',profile.lastName)}${field('Company',profile.company,true)}`+
      `${field('Job Title',profile.jobTitle,true)}${emailField(email)}</div></div>`+
      `<div class="role-strip">${tags(profile.roles)}${typeMarkup(profile.types)}</div>`+
      (profile.roles.includes('Mentor')?matrix('mentor',profile.mentor):'')+
      (profile.roles.includes('Mentee')?matrix('mentee',profile.mentee):'')+
      `<footer class="popup-actions"><button class="btn blue" type="button" data-close>&lt; BACK</button>`+
      contactButton(email)+`<div class="footer-email">email : <span>${esc(email)}</span>`+
      `<button type="button" class="copy-btn" data-copy aria-label="Copy email" ${email?'':'disabled'}>${copyIcon()}</button></div></footer>`;
    message.hidden=true;root.hidden=false;
    announceHeight();
  }
  function announceHeight(){
    const height=Math.ceil(shell.getBoundingClientRect().height);
    emit('HEIGHT',{height});
  }
  async function copyEmail(email){
    if(!email)return;
    try {await navigator.clipboard.writeText(email);}
    catch(e){
      const el=document.createElement('textarea');el.value=email;
      el.style.cssText='position:fixed;left:-9999px;top:0';
      document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();
    }
  }
  document.addEventListener('click',event=>{
    if(event.target.closest('#close-popup,[data-close]')){emit('CLOSE');return;}
    if(event.target.closest('[data-contact]')){
      if(currentProfile?.email)emit('CONTACT',{email:currentProfile.email});return;
    }
    if(event.target.closest('[data-copy]')){
      if(currentProfile?.email)copyEmail(currentProfile.email);
    }
  });
  document.addEventListener('keydown',event=>{if(event.key==='Escape')emit('CLOSE');});
  window.addEventListener('message',event=>{
    if(event.source!==window.parent)return;
    const data=event.data;
    if(!data||data.source!==WIX_SOURCE)return;
    if(data.type==='SET_PROFILE'){
      initialized=true;
      if(readyTimer)clearInterval(readyTimer);
      currentProfile=normalize(data.payload);
      render(currentProfile);
    }
  });
  if('ResizeObserver' in window){new ResizeObserver(announceHeight).observe(shell);}
  window.addEventListener('load',announceHeight);
  // Preview is intentionally local-only. No demo data leaks into the Wix iframe.
  if(window.parent===window){
    const bio='Lorem ipsum dolor sit amet, consectetuer adipiscing elit, sed diam nonummy nibh euismod tincidunt ut laoreet dolore magna aliquam erat volutpat. Ut wisi enim ad minim veniam, quis nostrud exerci tation ullamcorper suscipit lobortis nisl ut aliquip ex ea commodo consequat. Duis autem vel eum iriure';
    currentProfile=normalize({
      firstName:'Example',lastName:'',company:'Other',jobTitle:'ISC Group',
      email:'fullname@mail.com',roles:['Mentor','Mentee'],types:['Traditional','Peer-to-Peer'],
      mentor:{careerLevel:['Middle Manage.','Senior Leadership'],function:['Distribution'],area:['London Market','Regulated'],bio},
      mentee:{careerLevel:['Senior Leadership'],function:['Broking','Underwriting','Risk'],area:['London Market','Regulated','Unregulated'],bio}
    });
    render(currentProfile);
  }else{
    emit('READY');
    readyTimer=setInterval(()=>{if(!initialized)emit('READY');},350);
  }
})();
</script>

<script>
/* ISC — scroll principal v3.5 aplicado al popup sin tocar el JS de NP5.
   Indicador dentro del area blanca; el header azul y la X quedan fijos. */
(() => {
  const shell=document.getElementById('profile-shell');
  const viewport=document.getElementById('profile-content');
  const header=shell?.querySelector('.profile-header');
  if(!shell||!viewport||!header)return;
  const rail=document.createElement('div');
  rail.className='isc-scroll-rail';
  rail.setAttribute('aria-hidden','true');
  const grip=document.createElement('div');
  grip.className='isc-scroll-grip';
  rail.appendChild(grip);
  shell.appendChild(rail);
  let dragging=null;
  let queued=false;
  const schedule=()=>{
    if(queued)return;
    queued=true;
    requestAnimationFrame(()=>{queued=false;sync();});
  };
  function sync(){
    // Alineado exactamente a 8px por debajo del encabezado, como el HTML principal.
    rail.style.top=Math.ceil(header.getBoundingClientRect().height+8)+'px';
    if(viewport.hidden){rail.hidden=true;return;}
    const maxScroll=Math.max(0,viewport.scrollHeight-viewport.clientHeight);
    if(maxScroll<=1){rail.hidden=true;return;}
    rail.hidden=false;
    const railHeight=rail.clientHeight;
    if(railHeight<=0){rail.hidden=true;return;}
    const size=Math.min(railHeight,Math.max(32,railHeight*viewport.clientHeight/viewport.scrollHeight));
    grip.style.height=size+'px';
    const range=Math.max(0,railHeight-size);
    grip.style.top=(maxScroll>0?range*viewport.scrollTop/maxScroll:0)+'px';
  }
  viewport.addEventListener('scroll',schedule,{passive:true});
  window.addEventListener('resize',schedule,{passive:true});
  grip.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    dragging={startY:e.clientY,initialScroll:viewport.scrollTop};
    grip.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  grip.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const range=rail.clientHeight-grip.offsetHeight;
    const total=viewport.scrollHeight-viewport.clientHeight;
    if(range>0&&total>0){
      viewport.scrollTop=dragging.initialScroll+(e.clientY-dragging.startY)*total/range;
    }
  });
  const release=()=>{dragging=null;};
  grip.addEventListener('pointerup',release);
  grip.addEventListener('pointercancel',release);
  grip.addEventListener('lostpointercapture',release);
  if('ResizeObserver' in window){
    const observer=new ResizeObserver(schedule);
    observer.observe(viewport);
    observer.observe(shell);
    observer.observe(header);
  }
  const contentObserver=new MutationObserver(schedule);
  contentObserver.observe(viewport,{attributes:true,attributeFilter:['hidden'],childList:true,subtree:true});
  schedule();
})();
</script>
